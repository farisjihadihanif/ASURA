<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASURA Assistant</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #27211e;
      user-select: none;
    }
    #mascot-btn {
      position: fixed;
      right: 12px;
      bottom: 10px;
      width: 148px;
      height: 164px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    #mascot-btn[hidden] { display: none !important; }
    #mascot-btn img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 8px 16px rgba(39, 33, 30, 0.25));
      transform-origin: 50% 90%;
    }
    #mascot-btn:hover img, #mascot-btn:focus-visible img {
      animation: asura-wiggle 0.9s ease-in-out infinite;
    }
    @keyframes asura-wiggle {
      0%, 100% { transform: rotate(0deg) scale(1.05); }
      25% { transform: rotate(-9deg) scale(1.07); }
      75% { transform: rotate(9deg) scale(1.07); }
    }
    .mascot-label {
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translate(-50%, 6px);
      background: #d76b3e;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.8px;
      padding: 5px 14px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(39, 33, 30, 0.28);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    #mascot-btn:hover .mascot-label, #mascot-btn:focus-visible .mascot-label {
      opacity: 1;
      transform: translate(-50%, 0);
    }
    #popup-panel {
      position: fixed;
      inset: 8px;
      background: #fffaf5;
      border: 1px solid #eadfd7;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(39, 33, 30, 0.22);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #popup-panel[hidden] { display: none !important; }
    .header-bar {
      background: #d76b3e;
      color: #ffffff;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      z-index: 20;
    }
    .brand-title, .brand-sub { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
    }
    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: transparent;
      padding: 0;
      object-fit: contain;
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 0.4px;
      line-height: 1.1;
    }
    .brand-sub {
      font-size: 10.5px;
      opacity: 0.92;
      margin-top: 2px;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      position: relative;
    }
    .pill-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      height: 30px;
      padding: 0 12px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .pill-btn:hover { background: rgba(255, 255, 255, 0.3); }
    .pill-btn[hidden] { display: none !important; }
    /* Tombol Close bulat dengan ikon X persis di tengah */
    #btn-close, #btn-minimize {
      width: 30px;
      height: 30px;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 0;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #btn-close:hover, #btn-minimize:hover { background: rgba(255, 255, 255, 0.32); }
    /* Dropdown Menu (Gabungan + Chat Baru & Riwayat) */
    #header-dropdown {
      position: absolute;
      top: 38px;
      right: 12px;
      width: 200px;
      background: #ffffff;
      border: 1px solid #eadfd7;
      border-radius: 14px;
      box-shadow: 0 12px 28px rgba(39, 33, 30, 0.18);
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      z-index: 50;
    }
    #header-dropdown[hidden] { display: none !important; }
    .dropdown-item {
      width: 100%;
      border: none;
      background: transparent;
      color: #27211e;
      text-align: left;
      padding: 8px 10px;
      border-radius: 9px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #account-list { border-top: 1px solid #eadfd7; margin: 2px 0; padding-top: 3px; display: flex; flex-direction: column; gap: 2px; }
    #account-list[hidden] { display: none !important; }
    .dropdown-item[hidden] { display: none !important; }
    .dropdown-item:hover {
      background: #fbf5f0;
      color: #d76b3e;
    }
    #user-banner {
      background: #fbf5f0;
      border-bottom: 1px solid #eadfd7;
      padding: 7px 14px;
      font-size: 11.5px;
      font-weight: 700;
      color: #4f4640;
    }
    #history-drawer {
      background: #fffdfa;
      border-bottom: 1px solid #eadfd7;
      padding: 10px 12px;
      max-height: 200px;
      overflow-y: auto;
    }
    #history-drawer[hidden] { display: none !important; }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10.5px;
      font-weight: 700;
      color: #857870;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    #history-list { display: flex; flex-direction: column; gap: 5px; }
    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      border: 1px solid #eadfd7;
      border-radius: 10px;
      padding: 5px 8px;
      gap: 6px;
    }
    .history-item.active { border-color: #d76b3e; background: #fbf5f0; }
    .history-open-btn {
      flex: 1;
      border: none;
      background: transparent;
      text-align: left;
      font-size: 11.5px;
      color: #27211e;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .history-del-btn {
      border: none;
      background: transparent;
      color: #9e8f86;
      font-size: 14px;
      cursor: pointer;
      padding: 0 4px;
    }
    #view-login, #view-register {
      flex: 1;
      padding: 20px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }
    #view-login[hidden], #view-register[hidden] { display: none !important; }
    .login-desc { font-size: 12px; color: #6e625b; line-height: 1.5; }
    .field-label { font-size: 11px; font-weight: 700; margin-bottom: 4px; display: block; }
    .text-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dfd2c8;
      border-radius: 12px;
      background: #ffffff;
      font-size: 12.5px;
      outline: none;
    }
    .text-input:focus { border-color: #d76b3e; }
    .primary-btn {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 12px;
      background: #d76b3e;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
    }
    .demo-link {
      background: none;
      border: none;
      color: #d76b3e;
      font-size: 11.5px;
      text-decoration: underline;
      cursor: pointer;
      text-align: center;
    }
    #login-error { color: #b91c1c; font-size: 11.5px; }
    #view-chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    #view-chat[hidden] { display: none !important; }
    #messages-box {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      user-select: text;
    }
    .bubble {
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 16px;
      font-size: 12.5px;
      line-height: 1.5;
      word-wrap: break-word;
    }
    .bubble.assistant {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #eadfd7;
      color: #27211e;
      border-bottom-left-radius: 5px;
    }
    .bubble.user {
      align-self: flex-end;
      background: #efe7e1;
      color: #27211e;
      border-bottom-right-radius: 5px;
    }
    #action-bar {
      padding: 6px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .chip-btn {
      border: 1px solid #dfd2c8;
      background: #ffffff;
      color: #27211e;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .chip-btn.primary-chip {
      background: #d76b3e;
      border-color: #d76b3e;
      color: #ffffff;
    }
    .chip-btn.dark-chip {
      background: #27211e;
      border-color: #27211e;
      color: #ffffff;
    }
    .composer-bar {
      padding: 10px 12px;
      background: #ffffff;
      border-top: 1px solid #eadfd7;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #chat-input {
      flex: 1;
      border: 1px solid #dfd2c8;
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 12.5px;
      resize: none;
      height: 40px;
      font-family: inherit;
      outline: none;
    }
    #chat-input:focus { border-color: #d76b3e; }
    #btn-send {
      width: 38px;
      height: 38px;
      border: none;
      border-radius: 12px;
      background: #d76b3e;
      color: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <button id="mascot-btn" type="button"><img src="./assets/asura-mascot.png" alt="ASURA" /><span class="mascot-label">Minta ASURA</span></button>
  <div id="popup-panel" hidden>
    <div class="header-bar">
      <div class="brand-wrap">
        <img src="./assets/asura-mascot.png" alt="ASURA" class="brand-logo" />
        <div>
          <div class="brand-title">ASURA</div>
          <div class="brand-sub">Auto Surat</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-menu-dropdown" class="pill-btn" type="button" hidden>
          <span>Menu</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div id="header-dropdown" hidden>
          <button id="menu-new-chat" class="dropdown-item" type="button">
            <span>+</span>
            <span>Chat Baru</span>
          </button>
          <button id="menu-history" class="dropdown-item" type="button">
            <span>Riwayat Chat</span>
          </button>
          <button id="menu-switch" class="dropdown-item" type="button">
            <span>Ganti Akun</span>
          </button>
          <div id="account-list" hidden></div>
          <button id="btn-logout" class="dropdown-item" type="button" hidden>
            <span>Keluar</span>
          </button>
        </div>
        <button id="btn-minimize" type="button" title="Minimize">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button id="btn-close" type="button" title="Tutup">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
    <div id="view-login">
      <p class="login-desc">
        Masuk dengan akun <strong>Mahasiswa</strong> untuk membuat surat akademik maupun surat custom.
      </p>
      <form id="login-form" style="display:flex;flex-direction:column;gap:10px;">
        <div>
          <label class="field-label" for="input-nim">NIM Mahasiswa</label>
          <input id="input-nim" class="text-input" type="text" placeholder="NIM atau NIP" required />
        </div>
        <div>
          <label class="field-label" for="input-pass">Kata Sandi</label>
          <input id="input-pass" class="text-input" type="password" placeholder="••••••••" required />
        </div>
        <div id="login-error" hidden></div>
        <button id="btn-login-submit" class="primary-btn" type="submit">Masuk ke ASURA</button>
      </form>
      <button id="btn-fill-demo" class="demo-link" type="button" hidden>Isi Akun Demo</button>
      <button id="btn-show-register" class="demo-link" type="button">Belum punya akun? Daftar</button>
    </div>
    <div id="view-register" hidden>
      <p class="login-desc">Aktivasi akun memakai <strong>NIM / NIP</strong> dari data kampus.</p>
      <form id="register-form" style="display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:100%;">
        <div style="display:flex;gap:6px;">
          <input id="reg-nim" class="text-input" type="text" placeholder="NIM / NIP" required style="flex:1;" />
          <button id="btn-reg-check" class="primary-btn" type="button" style="width:auto;padding:0 14px;">Cek</button>
        </div>
        <div id="reg-profile" hidden></div>
        <div id="reg-fields" style="display:none;flex-direction:column;gap:8px;">
          <input id="reg-email" class="text-input" type="email" placeholder="Email (untuk pengiriman surat)" />
          <input id="reg-pass" class="text-input" type="password" placeholder="Buat kata sandi (min. 8 karakter)" minlength="8" />
        </div>
        <div id="register-error" hidden></div>
        <button id="btn-register-submit" class="primary-btn" type="submit" style="display:none;">Aktifkan Akun dan Masuk</button>
      </form>
      <button id="btn-back-login" class="demo-link" type="button">Sudah punya akun? Masuk</button>
    </div>
    <div id="view-chat" hidden>
      <div id="user-banner"></div>
      <div id="history-drawer" hidden>
        <div class="history-header">
          <span>Riwayat Percakapan</span>
          <button id="btn-close-history" type="button" style="border:none;background:none;color:#857870;cursor:pointer;font-size:12px;">Tutup</button>
        </div>
        <div id="history-list"></div>
      </div>
      <div id="messages-box"></div>
      <div id="action-bar"></div>
      <form id="chat-form" class="composer-bar">
        <textarea id="chat-input" placeholder="Ketik pesan atau keperluan surat..." rows="1"></textarea>
        <button id="btn-send" type="submit" title="Kirim">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>
  <script src="./renderer.js"></script>
</body>
</html>
